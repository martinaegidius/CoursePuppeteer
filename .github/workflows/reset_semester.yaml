name: Reset semester

on:
  schedule: 
      #automatically scheduled: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
      - cron: "00 00 15 8 *"  #15 th of august 
      - cron: "00 00 15 1 *"  #15th of january 
  workflow_dispatch: #adds a trigger to dispatch manually in the Actions tab of the UI 

jobs:
  prepare-message:
    runs-on: ubuntu-latest
    outputs:
      commit_message: ${{ steps.msg.outputs.commit_message }}
    steps:
      - name: Determine commit message
        id: msg
        run: |
          now=$(date '+%Y-%m-%d %H:%M')
          if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "commit_message=Scheduled cron reset sync at ${now}" >> $GITHUB_OUTPUT
          else
              echo "commit_message=Manual or general cron reset sync at ${now}" >> $GITHUB_OUTPUT
          fi
  
  push-updated-schedules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: prepare-message
    steps:
      - name: Checkout real main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main   # VERY IMPORTANT

      - name: Reset schedule.csv to future
        run: python3 scripts/generate_release_calendar.py

      - name: Commit + push schedule.csv safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add schedule.csv

          if git diff --cached --quiet; then
            echo "No changes detected, nothing to push."
            exit 0
          fi

          git commit -m "Semester reset on schedule.csv. ${{ needs.prepare-message.outputs.commit_message }}"
          git push origin main
          #git push -u origin HEAD:main_test #unit test -> passed 